name: Build

# Refs:
# ACT (for testing workflows locally): https://nektosact.com/

on:
  # Runs on push to development and feature branches
  push:
    branches:
      - development
      - 'feature/**'

  # Runs on pull requests targeting development and feature branches
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - development
      - 'feature/**'

  # Runs when this workflow is manually called
  workflow_dispatch:

  # Runs when this workflow is called by another workflow
  workflow_call:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pull source code
        uses: actions/checkout@v4

      - name: Install dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # For some reason, if we use v6.0.x the build fails with 300+ syntax errors (in act atleast). And using 8.0.x doesn't.

      - name: Install dotnet dependencies
        run: dotnet restore

      - name: Install ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install kramdown
        run: gem install kramdown

      # Converts the .md files in docs/ to .html
      - name: Compile local docs
        run: |
          cd ./docs/
          ruby ./compiler_script.rb
          cd ../

      # https://github.com/stardew-access/stardew-access/blob/aa2f9a380e9b2ce94932e86631d416dee7e94461/stardew-access/stardew-access.csproj#L52-L55
      - name: Build the mod
        run: |
          dotnet build -p:BuildConfig=GITHUB
          dotnet build -c Release -p:BuildConfig=GITHUB

      # Rename build zips, remove space and `-debug` suffix to the debug build
      - name: Rename build zips
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'workflow_call'
        run: |
          mkdir -p './out/'
          cd './stardew-access/bin/Debug/net6.0/'
          for f in *zip; do fnew=$(echo ${f} | sed 's/\ /-/g' | sed 's/.zip/-debug.zip/'); mv "${f}" "../../../../out/${fnew}"; done
          cd '../../../../'
          cd 'stardew-access/bin/Release/net6.0/'
          for f in *zip; do fnew=$(echo ${f} | sed 's/\ /-/g'); mv "${f}" "../../../../out/${fnew}"; done
          cd '../../../../'
          # ls './out/'

      # Ref: https://github.com/actions/upload-artifact
      # Upload artifacts on pull requests, manual workflow dispatch, and workflow calls
      - name: Upload zips as artifacts
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'workflow_call'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('stardew-access-pr-{0}', github.event.pull_request.number || github.run_number) || 'stardew-access-nightly' }}
          path: out/*.zip
